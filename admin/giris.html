<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetici Girişi | NovaSoft Ajans</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <script type="module" src="../assets/js/app/pages/admin/admin-shell.js"></script>
</head>
<body class="bg-light" data-admin-page="giris">
  <main class="container d-flex align-items-center py-5">
    <div class="row justify-content-center w-100 mx-0">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="surface-card card shadow-sm">
          <div class="card-body p-3 p-md-4">
            <p class="text-primary fw-semibold mb-2">NovaSoft Ajans</p>
            <h1 class="h3 fw-bold">Yönetici Girişi</h1>
            <p class="text-secondary" id="login-note">Demo bilgileri JavaScript kodunda açıkça yer alır. Bu ekran gerçek kimlik doğrulama veya erişim koruması sağlamaz. Uygulama girilen bilgileri saklamaz. Kişisel şifrenizi kullanmayın.</p>
            <p class="small">Demo kullanıcı adı: <code>admin</code><br>Demo şifre: <code>123</code></p>
            <form data-admin-login method="post" autocomplete="off" aria-describedby="login-note" novalidate>
              <div class="mb-3">
                <label class="form-label" for="login-username">Kullanıcı Adı</label>
                <input class="form-control" id="login-username" name="username" type="text" required autocapitalize="none" spellcheck="false">
              </div>
              <div class="mb-3">
                <label class="form-label" for="login-password">Şifre</label>
                <input class="form-control" id="login-password" name="password" type="password" required>
              </div>
              <button class="btn btn-primary w-100" type="submit" disabled>Giriş Yap</button>
              <p class="mt-3 mb-0 text-danger" data-login-status role="status"></p>
            </form>
            <a class="d-inline-block mt-3" href="../index.html">Ana Sayfaya Dön</a>
            <noscript><p class="mt-3 mb-0">Demo giriş için JavaScript’i etkinleştirin.</p></noscript>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
