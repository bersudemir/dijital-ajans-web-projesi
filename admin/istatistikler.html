<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İstatistikler | NovaSoft Ajans Yönetimi</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../assets/js/app/pages/admin/admin-shell.js"></script>
</head>
<body class="agency-admin bg-light" data-admin-page="istatistikler">
  <a class="agency-skip-link" href="#admin-main">İçeriğe geç</a>
  <div data-admin-shell></div>
  <main id="admin-main" class="agency-admin-main p-3 p-md-4" tabindex="-1" hidden>
    <div class="mb-4">
      <h1 class="h2 fw-bold">İstatistikler</h1>
      <p class="text-secondary mb-0">Sayılarla Ajans sayfasındaki metrikleri ve veri serilerini inceleyin.</p>
    </div>
    <p class="alert alert-info">İstatistik düzenleme prototipi. Bu formdaki değişiklikler public grafiklere uygulanmaz.</p>
    <form data-statistics>
      <div class="row g-4" data-statistics-fields></div>
      <div class="d-flex flex-wrap gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Değerleri Kontrol Et</button>
        <button class="btn btn-outline-secondary" type="reset">Değerleri Sıfırla</button>
        <a class="btn btn-outline-primary" href="../sayilarla-ajans.html">Public Grafikleri Gör</a>
      </div>
      <p class="mt-3" data-status role="status"></p>
    </form>
  </main>
</body>
</html>
