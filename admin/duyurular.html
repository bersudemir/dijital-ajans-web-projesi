<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duyurular | NovaSoft Ajans Yönetimi</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../assets/js/app/pages/admin/admin-shell.js"></script>
</head>
<body class="agency-admin bg-light" data-admin-page="duyurular">
  <a class="agency-skip-link" href="#admin-main">İçeriğe geç</a>
  <div data-admin-shell></div>
  <main id="admin-main" class="agency-admin-main p-3 p-md-4" tabindex="-1" hidden>
    <div class="mb-4">
      <h1 class="h2 fw-bold">Duyurular</h1>
      <p class="text-secondary mb-0">Ajans duyurularını hazırlayın ve yayın durumunu yönetin.</p>
    </div>
    <section class="surface-card card shadow-sm mb-4" aria-labelledby="list-title">
      <div class="card-header bg-transparent d-flex flex-wrap align-items-center justify-content-between gap-2 p-3 p-md-4">
        <h2 class="h5 mb-0" id="list-title">Duyuru kayıtları</h2>
        <button class="btn btn-primary" type="button" data-add>Yeni Duyuru</button>
      </div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
            <tr><th scope="col">Duyuru başlığı</th><th scope="col">Yayın tarihi</th><th scope="col">Dosyalar</th><th scope="col">Durum</th><th scope="col">İşlemler</th></tr>
          </thead>
          <tbody data-records></tbody>
        </table>
      </div>
    </section>
    <p data-status role="status"></p>
    <div class="modal fade" id="editor" tabindex="-1" aria-labelledby="editor-title" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <form class="modal-content" data-editor>
          <div class="modal-header">
            <h2 class="modal-title h5" id="editor-title">Kayıt</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Kapat"></button>
          </div>
          <div class="modal-body d-grid gap-3">
            <div class="alert alert-danger mb-0" data-form-error role="alert" hidden></div>
          <div>
            <label for="title" class="form-label">Başlık</label>
            <input id="title" name="title" class="form-control" required maxlength="150">
          </div>
          <div>
            <label for="summary" class="form-label">Kısa özet</label>
            <textarea id="summary" name="summary" class="form-control" rows="2" maxlength="240"></textarea>
          </div>
          <div>
            <label for="content" class="form-label">İçerik</label>
            <textarea id="content" name="content" class="form-control" rows="5" required></textarea>
          </div>
          <div>
            <label for="publishedAt" class="form-label">Yayın tarihi ve saati</label>
            <input id="publishedAt" name="publishedAt" class="form-control" type="datetime-local" required>
          </div>
          <p class="form-text mb-0" id="file-note">PDF, Word veya JPG/PNG/WebP görselleri seçin. Her dosya en fazla 256 KB olabilir.</p>
          <div>
            <label for="image" class="form-label">Görsel</label>
            <input id="image" name="image" class="form-control" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" aria-describedby="file-note">
          </div>
          <div>
            <label for="pdf" class="form-label">PDF</label>
            <input id="pdf" name="pdf" class="form-control" type="file" accept=".pdf,application/pdf" aria-describedby="file-note">
          </div>
          <div>
            <label for="word" class="form-label">Word Belgesi</label>
            <input id="word" name="word" class="form-control" type="file" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" aria-describedby="file-note">
          </div>
          <p class="small text-secondary mb-0" data-saved-files></p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="active" name="active" checked>
            <label class="form-check-label" for="active">Aktif · Sitede göster</label>
          </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Vazgeç</button>
            <button class="btn btn-primary" type="submit">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
