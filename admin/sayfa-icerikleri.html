<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa İçerikleri | NovaSoft Ajans Yönetimi</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="../assets/js/app/pages/admin/admin-shell.js"></script>
</head>
<body class="agency-admin bg-light" data-admin-page="sayfa-icerikleri">
  <a class="agency-skip-link" href="#admin-main">İçeriğe geç</a>
  <div data-admin-shell></div>
  <main id="admin-main" class="agency-admin-main p-3 p-md-4" tabindex="-1" hidden>
    <div class="mb-4">
      <h1 class="h2 fw-bold">Sayfa İçerikleri</h1>
      <p class="text-secondary mb-0" id="content-form-note">Site metinlerini ve iletişim bilgilerini düzenleyin. Sosyal medya bağlantıları isteğe bağlıdır.</p>
    </div>
    <form data-content-form aria-describedby="content-form-note">
      <div class="row g-3">
        <div class="col-xl-6">
          <fieldset class="surface-card card shadow-sm h-100 p-3 p-md-4">
            <legend class="h5 float-none w-auto mb-3">Hakkımızda</legend>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="about-title">Başlık</label>
                <input class="form-control" id="about-title" name="about-title" type="text" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="about-summary">Kısa açıklama</label>
                <textarea class="form-control" id="about-summary" name="about-summary" rows="3" required></textarea>
              </div>
              <div class="col-12">
                <label class="form-label" for="about-content">Kurumsal içerik</label>
                <textarea class="form-control" id="about-content" name="about-content" rows="5" required></textarea>
              </div>
            </div>
          </fieldset>
        </div>
        <div class="col-xl-6">
          <fieldset class="surface-card card shadow-sm h-100 p-3 p-md-4">
            <legend class="h5 float-none w-auto mb-3">Misyon &amp; Vizyon</legend>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="mission">Misyon</label>
                <textarea class="form-control" id="mission" name="mission" rows="3" required></textarea>
              </div>
              <div class="col-12">
                <label class="form-label" for="vision">Vizyon</label>
                <textarea class="form-control" id="vision" name="vision" rows="3" required></textarea>
              </div>
              <div class="col-12">
                <label class="form-label" for="values">Temel değerler</label>
                <textarea class="form-control" id="values" name="values" rows="6" aria-describedby="values-note" required></textarea>
                <p class="form-text mb-0" id="values-note">Her satıra “Değer adı | Açıklama” yazın.</p>
              </div>
            </div>
          </fieldset>
        </div>
        <div class="col-12">
          <fieldset class="surface-card card shadow-sm h-100 p-3 p-md-4">
            <legend class="h5 float-none w-auto mb-3">İletişim / Footer</legend>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="address">Açık adres</label>
                <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label" for="phone">Telefon</label>
                <input class="form-control" id="phone" name="phone" type="tel" required>
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label" for="email">E-posta</label>
                <input class="form-control" id="email" name="email" type="email" required>
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label" for="linkedin">LinkedIn</label>
                <input class="form-control" id="linkedin" name="linkedin" type="url">
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label" for="instagram">Instagram</label>
                <input class="form-control" id="instagram" name="instagram" type="url">
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label" for="github">GitHub</label>
                <input class="form-control" id="github" name="github" type="url">
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label" for="designer">Tasarımcı bilgisi</label>
                <input class="form-control" id="designer" name="designer" type="text" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="footer-description">Footer tanıtımı</label>
                <textarea class="form-control" id="footer-description" name="footer-description" rows="2" required></textarea>
              </div>
            </div>
          </fieldset>
        </div>
      </div>
      <button class="btn btn-primary mt-4" type="submit" disabled>Kaydet</button>
      <p class="mt-3" data-content-status role="status"></p>
    </form>
  </main>
</body>
</html>
